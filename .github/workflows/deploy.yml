name: Deploy To EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BASE_RESOURCE_PATH: ./src/main/resources/application.yml

permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yml 파일 만들기
        uses: microsoft/variable-substitution@v1
        with:
          files: ${{ env.BASE_RESOURCE_PATH }}
        env:
          # DB 접속 정보는 더 이상 빌드 시점에 주입하지 않는다.
          # RDS 제거 후 로컬 MySQL을 쓰며, 접속 정보는 배포 스크립트가
          # 런타임 환경변수(SPRING_DATASOURCE_*)로 주입한다.
          # 빌드 산출물(ECR 이미지)에 DB 자격증명이 박히지 않도록 하기 위함.
          jwt.secretKey: ${{ secrets.JWT_SECRET_KEY }}
          spring.mail.password: ${{ secrets.APP_PASSWORD }}
          spring.security.oauth2.client.registration.google.client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          spring.security.oauth2.client.registration.google.client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.google.redirect-uri: ${{ secrets.GOOGLE_REDIRECT_URL }}
          spring.security.oauth2.client.registration.kakao.client-id: ${{ secrets.KAKAO_CLIENT_ID }}
          spring.security.oauth2.client.registration.kakao.client-secret: ${{ secrets.KAKAO_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.kakao.redirect-uri: ${{ secrets.KAKAO_REDIRECT_URL }}
          spring.security.oauth2.client.registration.naver.client-id: ${{ secrets.NAVER_CLIENT_ID }}
          spring.security.oauth2.client.registration.naver.client-secret: ${{ secrets.NAVER_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.naver.redirect-uri: ${{ secrets.NAVER_REDIRECT_URL }}
          #        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/appIlication.yml

      - name: gradlew에 실행 권한 부여하기
        run: chmod +x ./gradlew

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build --scan -x test

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -t maimu-ecr .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag maimu-ecr ${{ steps.login-ecr.outputs.registry }}/maimu-server:latest

      - name: ECR에 Docker 이미지 Push하기
        run: docker push ${{ steps.login-ecr.outputs.registry }}/maimu-server:latest

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            if ! docker ps -a | grep -q redis; then
              docker run -d --name redis --network maimu-network --restart unless-stopped -e TZ=Asia/Seoul -v /etc/localtime:/etc/localtime:ro redis:latest --appendonly yes --appendfsync everysec
            fi

            # 기존 컨테이너에도 Write-back 버퍼의 AOF 영속화를 적용한다.
            docker start redis >/dev/null
            docker exec redis redis-cli CONFIG SET appendfsync everysec
            docker exec redis redis-cli CONFIG SET appendonly yes

            # 로컬 MySQL 자격증명 (서버에만 보관, 저장소/Secrets에 없음)
            DB_PW=$(sudo sed -n 's/^MYSQL_PWD=//p' /root/.maimu-local-db.env)

            # MySQL 컨테이너가 없으면 기동 (데이터는 maimu-mysql-data 볼륨에 영속)
            if ! docker ps -a --format '{{.Names}}' | grep -qx mysql; then
              docker run -d --name mysql \
                            --network maimu-network \
                            --restart unless-stopped \
                            -v maimu-mysql-data:/var/lib/mysql \
                            -e MYSQL_ROOT_PASSWORD="$DB_PW" \
                            -e MYSQL_DATABASE=maimu \
                            -e MYSQL_USER=admin \
                            -e MYSQL_PASSWORD="$DB_PW" \
                            -e TZ=Asia/Seoul \
                            mysql:8.0 \
                            --default-time-zone=+09:00 \
                            --character-set-server=utf8mb4 \
                            --collation-server=utf8mb4_unicode_ci \
                            --innodb-buffer-pool-size=128M \
                            --performance-schema=OFF \
                            --max-connections=50
            fi

            docker stop maimu-ecr || true
            docker rm maimu-ecr || true
            docker pull ${{ steps.login-ecr.outputs.registry }}/maimu-server:latest
            docker run -d --name maimu-ecr \
                          --network maimu-network \
                          --restart unless-stopped \
                          -p 8080:8080 \
                          -e REDIS_HOST=redis \
                          -e TZ=Asia/Seoul \
                          -e SPRING_DATASOURCE_URL='jdbc:mysql://mysql:3306/maimu?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&rewriteBatchedStatements=true' \
                          -e SPRING_DATASOURCE_USERNAME=admin \
                          -e SPRING_DATASOURCE_PASSWORD="$DB_PW" \
                          -e LOG_PATH=/logs \
                          -e ADMIN_EMAIL='${{ secrets.ADMIN_EMAIL }}' \
                          -v maimu-logs:/logs \
                          -v /etc/localtime:/etc/localtime:ro \
                          ${{ steps.login-ecr.outputs.registry }}/maimu-server:latest
